[versions]
kotlin = "2.3.20"
detekt = "1.23.8"
kss = "1.0.3"
xmlutil = "0.91.3"
kotlin-coroutines = "1.10.2"
vanniktech-maven-publish = "0.36.0"
kover = "0.9.1"
dokka = "2.2.0"
# svgo-kt's Maven coordinate version is composed from two halves:
#   `<svgo-upstream>-<svgokt>` (e.g. `4.0.1-0.1.0`)
#
# - `svgo-upstream` tracks the upstream svgo release this artifact mirrors and
#   is bumped manually when we sync against a new svgo version (driven by the
#   Epic that the SVGO-upgrade workflow creates).
# - `svgokt` is our own Kotlin-side semver, automatically bumped by
#   release-please based on conventional commits. The trailing
#   `# x-release-please-version` marker is what release-please's generic file
#   updater scans for, so do not remove it.
svgo-upstream = "4.0.1"
svgokt = "0.1.0" # x-release-please-version

[libraries]
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kss-bom = { module = "dev.tonholo.kss:kss-bom", version.ref = "kss" }
kss-core = { module = "dev.tonholo.kss:kss-core" }
kss-lexer = { module = "dev.tonholo.kss:kss-lexer" }
kss-parser = { module = "dev.tonholo.kss:kss-parser" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlinx-coroutines-js = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-js", version.ref = "kotlin-coroutines" }
kotlinx-coroutines-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "kotlin-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }
xmlutil-core = { group = "io.github.pdvrieze.xmlutil", name = "core", version.ref = "xmlutil" }

# Gradle plugin artifacts consumed as regular dependencies by `build-logic` so
# that convention plugin scripts can apply them with a plain `plugins { ... }`
# block.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
vanniktech-maven-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech-maven-publish" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }

[plugins]
org-jetbrains-kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
io-gitlab-arturbosch-detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
