name: Track upstream SVGO releases

# Runs once a day and whenever someone manually triggers it. Compares the
# upstream SVGO version this project mirrors (the `<svgo-upstream>` half of
# the `svgokt` entry in `gradle/libs.versions.toml`) against the latest
# `svgo` release on npm, and opens a tracking issue + milestone if a newer
# upstream release is available.
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check for new SVGO release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compare versions and open tracker if outdated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          catalog_version="$(grep -E '^svgokt\s*=' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          current_upstream="${catalog_version%-*}"

          latest_upstream="$(curl --fail --silent \
            -H 'Accept: application/json' \
            https://registry.npmjs.org/svgo/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"

          echo "current upstream:  $current_upstream"
          echo "latest  upstream:  $latest_upstream"

          if [[ "$current_upstream" == "$latest_upstream" ]]; then
            echo "::notice::Already on the latest upstream SVGO ($latest_upstream). Nothing to do."
            exit 0
          fi

          # Use sort -V to detect downgrades and skip them gracefully.
          newest="$(printf '%s\n%s\n' "$current_upstream" "$latest_upstream" | sort -V | tail -n1)"
          if [[ "$newest" != "$latest_upstream" ]]; then
            echo "::notice::Catalog version ($current_upstream) is ahead of npm ($latest_upstream). Nothing to do."
            exit 0
          fi

          milestone_title="Upgrade to SVGO ${latest_upstream}"

          # Check ALL milestones (open and closed). If an open milestone exists
          # we obviously don't want a duplicate, and if a CLOSED milestone with
          # the same title exists the maintainer has acknowledged this version
          # already; recreating it would be noise. Catalog-bump comparison at
          # the top of this script is the canonical signal that work is done.
          existing_milestone_number="$(
            gh api "repos/$GH_REPO/milestones?state=all&per_page=100" \
              --jq ".[] | select(.title == \"$milestone_title\") | .number" \
              | head -n1
          )"

          if [[ -n "$existing_milestone_number" ]]; then
            echo "::notice::Milestone '$milestone_title' (#$existing_milestone_number) already exists. Skipping."
            exit 0
          fi

          milestone_description=$(cat <<EOM
          Track the work needed to bring svgo-kt up to upstream SVGO ${latest_upstream}.

          Upstream releases: https://github.com/svg/svgo/releases
          Upstream changelog: https://github.com/svg/svgo/blob/main/CHANGELOG.md
          EOM
          )

          milestone_number="$(
            gh api "repos/$GH_REPO/milestones" \
              --method POST \
              --field "title=$milestone_title" \
              --field "description=$milestone_description" \
              --jq '.number'
          )"

          echo "Created milestone #$milestone_number"

          # Ensure the tracking label exists; create it on first run.
          if ! gh label list --json name --jq '.[].name' | grep -Fxq 'svgo-upgrade'; then
            gh label create svgo-upgrade \
              --color B60205 \
              --description 'Track the upgrade to a new upstream SVGO release'
          fi

          issue_body=$(cat <<EOM
          A new upstream SVGO release is available: **${latest_upstream}** (svgo-kt currently mirrors ${current_upstream}).

          ## Checklist
          - [ ] Read the upstream release notes: https://github.com/svg/svgo/releases/tag/v${latest_upstream}
          - [ ] Sync the vendored \`svgo/\` submodule / mirror to v${latest_upstream}
          - [ ] Re-run the full plugin fixture suite (\`./gradlew :svgo-kt:jvmTest\`)
          - [ ] Port any new plugins or behavior changes
          - [ ] Update the \`svgokt\` entry in \`gradle/libs.versions.toml\` to \`${latest_upstream}-x.y.z\`
          - [ ] Update README usage / installation snippets if API changes
          - [ ] Cut a release tag matching the new catalog version

          This issue is auto-generated by \`.github/workflows/svgo-upgrade-check.yml\`.
          EOM
          )

          gh issue create \
            --title "$milestone_title" \
            --label svgo-upgrade \
            --milestone "$milestone_title" \
            --body "$issue_body"
