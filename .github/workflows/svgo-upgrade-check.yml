name: Track upstream SVGO releases

# Runs once a day and whenever someone manually triggers it. Compares the
# upstream SVGO version this project mirrors (the `<svgo-upstream>` half of
# the `svgokt` entry in `gradle/libs.versions.toml`) against the latest
# `svgo` release on npm, and opens an Epic-typed tracking issue if a newer
# upstream release is available.
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check for new SVGO release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare versions and open Epic if outdated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          current_upstream="$(
            grep -E '^svgo-upstream\s*=' gradle/libs.versions.toml \
              | sed -E 's/.*"([^"]+)".*/\1/'
          )"

          latest_upstream="$(curl --fail --silent \
            -H 'Accept: application/json' \
            https://registry.npmjs.org/svgo/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"

          echo "current upstream:  $current_upstream"
          echo "latest  upstream:  $latest_upstream"

          if [[ "$current_upstream" == "$latest_upstream" ]]; then
            echo "::notice::Already on the latest upstream SVGO ($latest_upstream). Nothing to do."
            exit 0
          fi

          # Detect downgrades and skip them gracefully.
          newest="$(printf '%s\n%s\n' "$current_upstream" "$latest_upstream" | sort -V | tail -n1)"
          if [[ "$newest" != "$latest_upstream" ]]; then
            echo "::notice::Catalog version ($current_upstream) is ahead of npm ($latest_upstream). Nothing to do."
            exit 0
          fi

          issue_title="Upgrade to SVGO ${latest_upstream}"

          # Idempotency: skip if an issue with the same title already exists in
          # any state. Closing the Epic after the upgrade lands is the signal
          # that the work is done; we don't want to recreate it on the next run.
          existing="$(
            gh issue list \
              --repo "$GH_REPO" \
              --state all \
              --search "in:title \"$issue_title\"" \
              --json number,title \
              --jq ".[] | select(.title == \"$issue_title\") | .number" \
              | head -n1
          )"

          if [[ -n "$existing" ]]; then
            echo "::notice::Issue '$issue_title' (#$existing) already exists. Skipping."
            exit 0
          fi

          # Ensure the tracking label exists; create it on first run.
          if ! gh label list --repo "$GH_REPO" --json name --jq '.[].name' | grep -Fxq 'svgo-upgrade'; then
            gh label create svgo-upgrade \
              --repo "$GH_REPO" \
              --color B60205 \
              --description 'Track the upgrade to a new upstream SVGO release'
          fi

          issue_body=$(cat <<EOM
          A new upstream SVGO release is available: **${latest_upstream}** (svgo-kt currently mirrors ${current_upstream}).

          ## Checklist
          - [ ] Read the upstream release notes: https://github.com/svg/svgo/releases/tag/v${latest_upstream}
          - [ ] Sync the vendored \`svgo/\` submodule / mirror to v${latest_upstream}
          - [ ] Re-run the full plugin fixture suite (\`./gradlew :svgo-kt:jvmTest\`)
          - [ ] Port any new plugins or behavior changes
          - [ ] Update the \`svgo-upstream\` entry in \`gradle/libs.versions.toml\` to \`${latest_upstream}\`
          - [ ] Update the \`package-name\` field in \`release-please-config.json\` to \`${latest_upstream}\` so future release tags use the new prefix
          - [ ] Decide whether to bump \`svgokt\` major (breaking) or keep it incrementing as a feature/fix
          - [ ] Update README usage / installation snippets if API changes
          - [ ] Merge the resulting release-please PR to cut the new release

          This Epic is auto-generated by \`.github/workflows/svgo-upgrade-check.yml\`.
          EOM
          )

          # Use the REST API directly so we can set the issue `type` (the new
          # GitHub Issue Types feature -- Bug / Epic / Feature / Task). The
          # `gh issue create` flag for this varies by gh version, so the API
          # call is the most portable option.
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GH_REPO/issues" \
            --field "title=$issue_title" \
            --field "body=$issue_body" \
            --field "type=Epic" \
            --field 'labels[]=svgo-upgrade'
