name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu hosts the JVM, JS (node), WasmJS (node) and linuxX64
          # native targets. Running them all on a single Ubuntu runner is
          # the cheapest way to cover the bulk of the test surface,
          # including the full 363-fixture upstream parity suite (jvmTest).
          - os: ubuntu-latest
            label: Ubuntu (JVM, JS, WasmJS, linuxX64)
            tasks: ":svgo-kt:assemble :svgo-kt:jvmTest :svgo-kt:jsNodeTest :svgo-kt:wasmJsNodeTest :svgo-kt:linuxX64Test"
          # macOS hosts the macosArm64 native target, which is the primary
          # Apple Silicon configuration for downstream consumers and the
          # one we develop against locally.
          - os: macos-latest
            label: macOS (macosArm64)
            tasks: ":svgo-kt:macosArm64Test"
          # Windows hosts the mingwX64 native target so the cross-platform
          # sanity test runs on every officially supported native host.
          - os: windows-latest
            label: Windows (mingwX64)
            tasks: ":svgo-kt:mingwX64Test"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Run tests
        shell: bash
        run: ./gradlew ${{ matrix.tasks }}

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4.6.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            svgo-kt/build/reports/tests/
            svgo-kt/build/test-results/
          retention-days: 7

  lint:
    name: Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Run detekt
        run: ./gradlew :svgo-kt:detekt

      - name: Upload detekt reports on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4.6.2
        with:
          name: detekt-reports
          path: svgo-kt/build/reports/detekt/
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Run tests with coverage
        run: ./gradlew :svgo-kt:koverXmlReport :svgo-kt:koverHtmlReport

      - name: Upload Kover HTML report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4.6.2
        with:
          name: kover-html-report
          path: svgo-kt/build/reports/kover/html/
          retention-days: 14

      - name: Upload Kover XML report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4.6.2
        with:
          name: kover-xml-report
          path: svgo-kt/build/reports/kover/report.xml
          retention-days: 14

      - name: Verify coverage thresholds
        run: ./gradlew :svgo-kt:koverVerify
