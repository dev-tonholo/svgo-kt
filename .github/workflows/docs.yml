name: Docs

# Builds the Dokka API site for `:svgo-kt` and publishes it to GitHub
# Pages on every push to `main`. Pull requests build the site as a
# preview but don't deploy, so doc regressions still fail CI without
# stomping the live site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # GitHub Pages only allows one in-flight deployment at a time. Don't
  # cancel the in-progress publish if another commit lands quickly --
  # let it finish so the eventually-published site is consistent.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Dokka site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build Dokka site
        run: ./gradlew :svgo-kt:dokkaGenerate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: svgo-kt/build/dokka/html

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    # Don't deploy from PR runs -- only from `main`.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
