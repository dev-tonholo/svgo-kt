name: Publish

on:
  push:
    # Match the svgo-kt version scheme `<svgo-upstream>-<svgo-kt>`
    # (e.g. `4.0.1-0.1.0`). Tag the release commit with the same string
    # used in `gradle/libs.versions.toml`'s `svgokt` entry.
    tags:
      - '[0-9]*.[0-9]*.[0-9]*-[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup

      - name: Verify tag matches catalog version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          catalog_version="$(grep -E '^svgokt\s*=' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$tag" != "$catalog_version" ]]; then
            echo "::error::Tag '$tag' does not match the svgokt catalog version '$catalog_version'."
            echo "Update gradle/libs.versions.toml before tagging." >&2
            exit 1
          fi
          echo "Tag and catalog version match: $tag"

      - name: JVM tests
        run: ./gradlew :svgo-kt:jvmTest

      - name: JS tests
        run: ./gradlew :svgo-kt:jsNodeTest

      - name: Linux x64 native tests
        run: ./gradlew :svgo-kt:linuxX64Test

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: verify
    environment: publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup

      - name: Publish
        run: ./gradlew :svgo-kt:publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
