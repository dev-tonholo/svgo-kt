name: Publish

on:
  # Tag-driven release: push a tag matching the svgo-kt version scheme
  # `<svgo-upstream>-<svgo-kt>` (e.g. `4.0.1-0.1.0`) to trigger a publish.
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*-[0-9]*.[0-9]*.[0-9]*'

  # GitHub release: publishing a release that points at a tag triggers the
  # same flow, so the maintainer can also drive releases from the UI.
  release:
    types: [published]

  # Manual fallback: dispatch with an explicit tag to re-run a publish (for
  # example after a transient Sonatype outage) without needing to re-tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must match `gradle/libs.versions.toml` svgokt entry, e.g. 4.0.1-0.1.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# All publish jobs derive the ref from the same fallback chain so the three
# triggers are interchangeable.
env:
  PUBLISH_REF: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PUBLISH_REF }}
      - uses: ./.github/actions/setup

      - name: Verify tag matches catalog version
        shell: bash
        run: |
          set -euo pipefail
          tag="${PUBLISH_REF}"
          upstream="$(
            grep -E '^svgo-upstream\s*=' gradle/libs.versions.toml \
              | sed -E 's/.*"([^"]+)".*/\1/'
          )"
          own="$(
            grep -E '^svgokt\s*=' gradle/libs.versions.toml \
              | sed -E 's/.*"([^"]+)"[^"]*$/\1/'
          )"
          catalog_version="${upstream}-${own}"
          if [[ "$tag" != "$catalog_version" ]]; then
            echo "::error::Tag '$tag' does not match the catalog version '$catalog_version' (svgo-upstream=$upstream, svgokt=$own)."
            echo "Update gradle/libs.versions.toml before tagging." >&2
            exit 1
          fi
          echo "Tag and catalog version match: $tag"

      - name: JVM tests
        run: ./gradlew :svgo-kt:jvmTest

      - name: JS (node) tests
        run: ./gradlew :svgo-kt:jsNodeTest

      - name: WasmJS (node) tests
        run: ./gradlew :svgo-kt:wasmJsNodeTest

      - name: Linux x64 native tests
        run: ./gradlew :svgo-kt:linuxX64Test

  publish-maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: verify
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PUBLISH_REF }}
      - uses: ./.github/actions/setup

      # `publishAndReleaseToMavenCentral` uploads every klib (Kotlin 2.3
      # cross-compiles all KMP native targets from Linux) and then triggers
      # the auto-release on the Sonatype Central Portal so we don't need to
      # promote manually.
      - name: Publish to Maven Central
        run: ./gradlew :svgo-kt:publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: verify
    environment: publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PUBLISH_REF }}
      - uses: ./.github/actions/setup

      - name: Publish to GitHub Packages
        run: ./gradlew :svgo-kt:publishAllPublicationsToGithubPackagesRepository --no-configuration-cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Reuse the same signing material so consumers can verify the
          # GitHub Packages artifacts the same way as the Central artifacts.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
